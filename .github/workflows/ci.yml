name: CI

# O que roda a cada empurrão e a cada proposta de junção.
#
# Três tarefas, na ordem em que o erro costuma aparecer: o relay tem suíte
# própria em Node e é a mais rápida; os testes do jogo abrem as cenas de verdade
# com os autoloads de verdade; e o APK só é montado depois que os dois passaram,
# porque exportar código quebrado é gastar dez minutos para produzir um pacote
# que ninguém deveria instalar.
#
# A versão do Godot está escrita **uma vez**, aqui. Ela tem de ser a mesma do
# `config/features` no `project.godot` — uma máquina de CI com outra versão
# reimporta o projeto inteiro e passa a testar algo que ninguém roda.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable

# Um empurrão novo na mesma branch cancela o anterior: o resultado do commit de
# trás deixou de interessar no instante em que existe um da frente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      # `npm ci` e não `npm install`: ele obedece ao lockfile em vez de resolver
      # versões de novo, que é a diferença entre testar o que está no repositório
      # e testar o que o registro publicou hoje de manhã.
      - run: npm ci
        working-directory: relay

      - run: npm run typecheck
        working-directory: relay

      - run: npm test
        working-directory: relay

  jogo:
    name: Testes do jogo (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Instalar o Godot
        uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # A importação é o primeiro teste, e não uma preparação para ele: é aqui
      # que um erro de sintaxe aparece. Sem esta verificação o erro não falha
      # nada — a cena simplesmente não carrega, o processo não termina, e o
      # trabalho morre no tempo limite meia hora depois.
      - name: Importar e conferir os scripts
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::erro de script durante a importação"
            grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log
            exit 1
          fi

      - name: Regras (perft, damas, QR, prefs)
        run: godot --headless --path . --script res://tests/test_runner.gd

      # Tema e componentes base: fontes embarcadas com os acentos do português,
      # contraste dos pares de texto, as variações que as telas pedem, e a
      # geometria e o comportamento de cada componente. O que só a imagem prova —
      # peças e cartas intactas — fica com `tests/image_diff.gd`, que precisa de GPU.
      - name: Kit de interface
        run: godot --headless --path . --script res://tests/ui_kit_probe.gd

      - name: Camada de cena
        run: godot --headless --path . res://tests/scene_probe.tscn

      - name: Menu e pareamento
        run: godot --headless --path . res://tests/pairing_probe.tscn

      - name: Ludo
        run: godot --headless --path . res://tests/ludo_probe.tscn

      - name: Metrópole
        run: godot --headless --path . --script res://tests/monopoly_probe.gd

      - name: Uno
        run: |
          godot --headless --path . res://tests/uno_probe.tscn
          godot --headless --path . res://tests/uno_scene_probe.tscn

      # A sinuca é o único jogo do app com física, e é a suíte que mais se paga:
      # o que ela persegue não é o que uma tacada faz, é que a mesa **para**, que
      # as bolas ficam no pano, e que a mesma tacada dá a mesma mesa bit a bit —
      # que é a propriedade em que a rede inteira dela se apoia.
      - name: Sinuca
        run: |
          godot --headless --path . --script res://tests/pool_probe.gd
          godot --headless --path . res://tests/pool_scene_probe.tscn

      # As quatro suítes do Bomberman, e não só a simulação.
      #
      # Só `bomber_probe` rodava aqui, e as outras três existiam no repositório
      # sem nunca serem executadas por ninguém além de quem as escreveu. São
      # justamente as que cobrem o que o jogo tem de mais difícil de depurar
      # depois: a sala autoritativa (que é o servidor), a previsão do cliente e a
      # serialização do snapshot — três lugares onde um erro aparece como
      # "desincronizou" no celular de outra pessoa, dias depois.
      - name: Bomberman
        run: |
          godot --headless --path . --script res://tests/bomber_probe.gd
          godot --headless --path . --script res://tests/bomber_room_probe.gd
          godot --headless --path . --script res://tests/bomber_snapshot_probe.gd
          godot --headless --path . --script res://tests/bomber_predict_probe.gd
          godot --headless --path . res://tests/bomber_match_offline_probe.tscn

      # O caminho pela internet, contra um relay de verdade. É o único teste que
      # exercita o aperto de mão inteiro — sala aberta de um lado, código do
      # outro — e o único que pegaria uma divergência entre o protocolo do jogo e
      # o do servidor, que são dois repositórios de linguagens diferentes dentro
      # do mesmo.
      - name: Subir o relay
        run: |
          npm ci
          npm run build
          nohup node dist/main.js > relay.log 2>&1 &
          # Espera a porta abrir em vez de dormir um número redondo: numa máquina
          # lenta o `sleep 2` falha, e numa rápida ele desperdiça dois segundos
          # por execução.
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 8080; then exit 0; fi
            sleep 1
          done
          echo "::error::o relay não subiu"
          cat relay.log
          exit 1
        working-directory: relay

      # Os sete caminhos pela internet, e não dois.
      #
      # Quatro destes existiam sem rodar. Eles não são repetição do `relay_smoke`:
      # aquele prova o aperto de mão de **dois** assentos, e o que estes cobrem é
      # o que cada jogo acrescentou em cima dele — a mesa de quatro do Ludo, os
      # assentos que viram máquina quando ela não enche, a semente e a regra da
      # casa do Uno, e o formato de Metrópole. Todos são coisas que viajam no
      # `welcome`, e uma divergência ali não dá erro: dá duas partidas diferentes
      # com a mesma cara, cada uma num aparelho.
      #
      # O sétimo é o de quem **volta**: queda sem aviso virando bot, a chave
      # devolvendo o mesmo assento, e o anfitrião que cai sendo recebido pelos
      # outros em vez de abrir uma partida nova com outra semente.
      - name: Partida ponta a ponta
        env:
          CHESS_RELAY_URL: ws://127.0.0.1:8080/ws
        run: |
          godot --headless --path . --script res://tests/relay_smoke.gd
          godot --headless --path . --script res://tests/table_smoke.gd
          godot --headless --path . --script res://tests/ludo_net_smoke.gd
          godot --headless --path . --script res://tests/ludo_bots_smoke.gd
          godot --headless --path . --script res://tests/uno_net_smoke.gd
          godot --headless --path . --script res://tests/monopoly_net_smoke.gd
          godot --headless --path . --script res://tests/rejoin_smoke.gd

      # O Bomberman não passa pelo relay: ele fala UDP com um servidor que é o
      # mesmo projeto Godot, sem tela. Este é o único teste que sobe os dois e
      # prova que eles se entendem — conectar, criar sala, começar, mandar
      # comando, receber snapshot que decodifica, e ver o tique do servidor andar.
      - name: Bomberman ponta a ponta
        run: |
          godot --headless --path . res://server/main.tscn -- --port 27200 > bomber-server.log 2>&1 &
          server=$!
          for _ in $(seq 1 20); do
            grep -q "servidor ouvindo" bomber-server.log && break
            sleep 1
          done
          if ! grep -q "servidor ouvindo" bomber-server.log; then
            echo "::error::o servidor de Bomberman não subiu"
            cat bomber-server.log
            exit 1
          fi
          godot --headless --path . res://tests/bomber_net_smoke.tscn -- --port 27200 --create
          status=$?
          kill "$server" 2>/dev/null || true
          exit $status

  apk:
    name: APK de depuração
    needs: [relay, jogo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # O Godot chama o Gradle, que precisa de um JDK 17 — o mesmo da build do
      # plugin logo abaixo, para os dois não compilarem contra bibliotecas
      # diferentes.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Instalar o Godot
        uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # O `.aar` é saída de build e não está versionado; o `.gdap` ao lado dele
      # está, porque é configuração. Reconstruir aqui é o que garante que o
      # Kotlin do plugin ainda compila — um plugin quebrado só apareceria no
      # aparelho, na primeira vez que alguém apontasse a câmera para um QR.
      - name: Construir o plugin Android
        run: |
          chmod +x ./gradlew
          ./gradlew :plugin:assembleRelease --no-daemon
          cp plugin/build/outputs/aar/ChessAndCheckersPlugins.release.aar ../android/plugins/
        working-directory: android_plugin

      # O Godot procura o SDK nos ajustes do **editor**, que numa máquina de CI
      # não existem. O arquivo é escrito à mão com os dois caminhos, que é mais
      # curto que abrir o editor para clicar neles.
      #
      # O nome do arquivo carrega a versão **menor** do Godot — `4.7.1-stable`
      # grava em `editor_settings-4.7.tres`. Com outro nome o Godot não reclama:
      # ele cria o dele, vazio, e a exportação falha dizendo que não achou o SDK.
      - name: Apontar o SDK do Android para o Godot
        run: |
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-$minor.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES

      - name: Importar
        run: godot --headless --path . --import

      # O `--install-android-build-template` **não é comando avulso** — o próprio
      # `--help` do Godot diz "used in conjunction with --export-release or
      # --export-debug". Sozinho ele abre o editor, instala o modelo e fica no
      # laço principal para sempre: foi assim que a primeira execução desta
      # esteira ficou pendurada sem erro nenhum até o limite de tempo.
      #
      # E o export em `--headless` também não encerra o processo sozinho: a
      # thread de varredura do sistema de arquivos segura o Godot depois de o APK
      # estar escrito e assinado. Então o que decide o resultado aqui é **o
      # artefato**, e não o código de saída — o laço espera o `DONE` do export
      # aparecer no log, mata o processo e confere o arquivo.
      - name: Exportar o APK
        run: |
          mkdir -p build/android
          godot --headless --path . \
            --install-android-build-template \
            --export-debug "Android" build/android/cascapp.apk > export.log 2>&1 &
          pid=$!
          # 30 minutos de teto: numa máquina fria o Gradle baixa o mundo antes de
          # compilar. Com cache quente o export inteiro leva menos de um minuto.
          for _ in $(seq 1 360); do
            grep -q "DONE.*export" export.log && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 5
          done
          kill "$pid" 2>/dev/null || true

          if [ ! -s build/android/cascapp.apk ]; then
            echo "::error::o APK não foi gerado"
            tail -60 export.log
            exit 1
          fi
          ls -lh build/android/cascapp.apk

      - uses: actions/upload-artifact@v5
        with:
          name: cascapp-debug-apk
          path: build/android/cascapp.apk
          # Sete dias: o APK de um commit serve para testar aquele commit, e
          # depois disso o que se quer é o da ponta.
          retention-days: 7

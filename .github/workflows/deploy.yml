name: Deploy

# Publica o relay no Fly.
#
# ## O segredo
#
#   FLY_API_TOKEN   um token do Fly com acesso ao app do relay
#
# Sem ele a tarefa **falha dizendo isso**, em vez de tentar o deploy e morrer
# dentro do `flyctl` com uma mensagem de autenticação que não explica o que
# fazer. Criar com `fly tokens create deploy -a chess-checkers-relay`.
#
# ## Por que só em `main`
#
# Deploy é uma mudança que os jogadores veem no mesmo minuto. Numa branch de
# trabalho ele derrubaria a partida de quem está jogando para publicar código que
# ainda está sendo escrito. `workflow_dispatch` existe para o caso de precisar
# publicar sem um commit novo.
#
# ## E por que o filtro de caminho
#
# Só o relay é publicado aqui. Uma mudança no app não reinicia as salas em curso.

on:
  push:
    branches: [main]
    paths:
      # O relay é um projeto Node inteiro, dentro de uma pasta só.
      - "relay/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Um deploy por vez, e o da frente espera em vez de ser cancelado: metade de uma
# publicação abandonada é um app em estado desconhecido, que é pior que um
# minuto de espera.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Os testes do relay, e não um atalho: publicar código quebrado é pior que não
  # publicar.
  testes:
    name: Testes antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci
        working-directory: relay

      - run: npm run typecheck
        working-directory: relay

      - run: npm test
        working-directory: relay

  relay:
    name: Relay (Node)
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Conferir o segredo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::falta o segredo FLY_API_TOKEN — veja o cabeçalho deste arquivo"
            exit 1
          fi

      - name: Publicar
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # Só a pasta: o `flyctl` acha o `fly.toml` dentro dela, e o `dockerfile` do
        # `[build]` é relativo a ele. Com `--config relay/fly.toml` junto, o
        # flyctl novo resolve o caminho a partir da pasta e procura
        # `relay/relay/fly.toml`.
        run: flyctl deploy --remote-only relay

      # **Uma máquina, e isto não é otimização de custo.**
      #
      # As salas moram na memória do processo. Com duas máquinas atrás do mesmo
      # endereço, anfitrião e convidado caem em processos diferentes e nunca se
      # acham — e o sintoma, do lado do jogador, é "nenhuma partida com esse
      # código", que parece erro de digitação. O `fly deploy` pode criar a
      # segunda sozinho, então a esteira desfaz isso a cada publicação em vez de
      # depender de alguém lembrar.
      - name: Uma máquina só
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count 1 --yes --config relay/fly.toml

      # A prova de que subiu, e ela não é o código de saída do `deploy`: o que
      # decide é o processo **respondendo**. `machine` é o mesmo campo que o
      # README manda conferir à mão — duas chamadas com valores diferentes são a
      # segunda máquina de volta.
      - name: Conferir que responde
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS https://chess-checkers-relay.fly.dev/healthz > health.json; then
              cat health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::o relay não respondeu ao /healthz depois do deploy"
          exit 1

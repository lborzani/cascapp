# Stack das contas no servidor de casa (`homeserver`, Raspberry Pi).
#
# Escuta só no 127.0.0.1. Para a internet sai pelo túnel do Cloudflare (serviço
# `tunnel`): `api.cascapp.com.br` (só `/api/` e `/search`) e `relay.cascapp.com.br`.
# O painel admin fica só na tailnet (porta 8092). O Funnel da 8443 segue no ar
# para as versões do app até a 1.56.
# Ver o README desta pasta.
name: cascapp-contas

services:
  pocketbase:
    build: .
    image: cascapp-pocketbase:0.40.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8090"
    volumes:
      - pb_data:/pb/pb_data
    # O segredo que o relay manda ao registrar um resultado de xadrez. Mora no
    # `.env` ao lado deste arquivo, no servidor, fora do repositório. Vazio, a
    # rota do resultado recusa tudo e o Elo não muda.
    environment:
      CASCAPP_RELAY_SECRET: ${CASCAPP_RELAY_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Analisa as revisões de xadrez (`worker/`). Sem porta: fala com o PocketBase
  # pela rede do compose, com um superusuário só dele (`WORKER_EMAIL` e
  # `WORKER_PASSWORD` no `.env`). Três núcleos no máximo, para sobrar um para o
  # galaticos e o resto da Pi.
  worker:
    build: worker
    image: cascapp-worker:sf19
    restart: unless-stopped
    cpus: "3"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_URL: http://pocketbase:8090
      PB_EMAIL: ${WORKER_EMAIL:-}
      PB_PASSWORD: ${WORKER_PASSWORD:-}
      # 200 mil, quatro vezes o que o app faz em 300 ms num Galaxy A16 (50 mil,
      # medido por adb em 2026-11-12): uma partida de 40 lances sai em ~23 s, a
      # mesma espera da revisão local de hoje. O motor local fica em 50 mil.
      NODES: ${WORKER_NODES:-200000}
      THREADS: "3"

  # Busca de uma posição na hora (`worker/search.mjs`), para o desafio e a
  # avaliação ao vivo. Mesma imagem do worker, outro processo, um núcleo. O
  # túnel publica `api.cascapp.com.br/search` (ver o README). Confere o token de
  # quem pede no PocketBase pela rede do compose.
  search:
    image: cascapp-worker:sf19
    restart: unless-stopped
    command: ["node", "/app/search.mjs"]
    cpus: "1"
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_URL: http://pocketbase:8090
      SEARCH_NODES: ${SEARCH_NODES:-100000}

  # O relay das partidas online (`relay/` na raiz do repositório). As salas moram
  # na memória do processo: um container só, nunca réplicas. Sai para a internet
  # pelo túnel do Cloudflare (`relay.cascapp.com.br`, serviço `tunnel` abaixo).
  # Fala com o PocketBase pela rede do compose, sem passar pelo Funnel. A imagem
  # é construída à parte, a partir da pasta `relay/` (ver o README).
  relay:
    image: cascapp-relay:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8080"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      CASCAPP_RELAY_SECRET: ${CASCAPP_RELAY_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Túnel do Cloudflare, e não o Funnel: o ingresso do Funnel fica
  # em Nova York e um lance levava ~280 ms; a borda do Cloudflare fica em São
  # Paulo. As rotas (`relay.cascapp.com.br` -> `http://relay:8080`;
  # `api.cascapp.com.br` `^/api/` -> `http://pocketbase:8090` e `^/search$` ->
  # `http://search:8093`) ficam
  # no painel do Cloudflare (Zero Trust > Tunnels). O token mora no
  # `.env` (`CLOUDFLARE_TUNNEL_TOKEN`).
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - relay
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pb_data:
